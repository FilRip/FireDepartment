;    LOCK_HARD        : Sound buffer locked in hardware      [0*..1] (NOT USED)
;    LOCK_SOFT        : Sound buffer locked in software      [0*..1] (NOT USED)
;    START_DELAY      : Sound delay before play              [0*..[
;    3D_MIN_DISTANCE  : [ONLY IF 'USE_3D=1'] Set minimum sound distance for attenuation [1.0f..1000000000.0f]
