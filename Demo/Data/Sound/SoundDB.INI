; ***********************************************************************************
;
;                           SOUND DATABASE DESCRIPTION
;
; ***********************************************************************************
;
; You can use [#INCLUDE] section name to have recursive INI includes
;
; Key description, '*' indicate default value:
;    FILENAME         : complete path of file to load
;    USER_PARAM       : User defined parameter				Default -1
;    VOLUME	      : Default sound volume		     [0..100]	Default 100
;    PRIORITY         : Sound priority 100 = highest , 0 = lowest
;			Example : 100 for streaming, 75 for 2D, 50 to 0 for 3D
;    CATEGORY         : Sound category (user defined)        [-1..[	Default -1
;    USE_STREAMING    : Sound is played using streaming      [0|1]	Default 0
;    USE_3D           : Sound use 3D positionning            [0|1]	Default 0
;    LOOP             : Sound loop when finished             [0|1]	Default 0
;    KEEP_IN_MEMORY   : Sound kept in memory after its end   [0|1]	Default 0
;    START_DELAY      : Sound start after delay in milliseconds [0*..[	Default -1
;    3D_MIN_DISTANCE  : [ONLY IF 'USE_3D=1'] Meters / minimum sound distance for attenuation [1.0f..1000000000.0f] Default D_MS_DEFAULT_MIN_DISTANCE
;    3D_MAX_DISTANCE  : [ONLY IF 'USE_3D=1'] Meters / Set maximum sound distance for attenuation [1.0f..1000000000.0f] Default D_MS_DEFAULT_MAX_DISTANCE
;
; ***********************************************************************************

