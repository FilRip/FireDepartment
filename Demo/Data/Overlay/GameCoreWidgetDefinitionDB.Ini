; *******************************************************************************************
;   Types d'objets actuellement définis
;      "WIDGET"
;      "BUTTON"
;      "COMBO"
;      "EDIT"
;      "CURVE"
;      "GROUP"
;      "HSCROLL"
;      "LIST"
;      "PROGRESS"
;      "RENDER"
;      "VSCROLL"
;
;   Liste des noms d'objets crées par la couche overlay désignés par le champ EQUIVALENT dans une section
;       D_MO_WIDGET_ROOT_OBJECT_NAME    "ROOT"
;       D_MOW_HS_BUTTON_LEFT            "HsBtnLeft"
;       D_MOW_HS_BUTTON_RIGHT           "HsBtnRight"
;       D_MOW_HS_BUTTON_THUMBTRACK      "HsBtnThmb"
;       D_MOW_VS_BUTTON_UP              "VsBtnUp"
;       D_MOW_VS_BUTTON_DOWN            "VsBtnDown"
;       D_MOW_VS_BUTTON_THUMBTRACK      "VsBtnThmb"
;       D_MOW_LB_VSCROLL                "LbVs"
;       D_MOW_CB_LISTBOX                "CbLb"
;       D_MOW_CB_EDIT                   "CbEdit"
;       D_MOW_CB_DEPLOY                 "CbBtnDeploy"
;
;       Cas spécifique pour l'insertion dans la listbox :
;		"Lyix" ou y représente le numéro de la ligne et x, la colonne
;       
;
;   Parametres (* = default)
;       TYPE                            Type of object to create
;       PARENT                          Parent of object to create
;       PRIORITY                        Priority of object [0..100]
;       ZPRIORITY                       Z priority of object [0,0..1,0]
;       EQUIVALENT                      Used to identify current object as an internal create object
;                                           (so this object is only updated)
;       X                               Position on X in parent area
;       Y                               Position on Y in parent area
;       WIDTH                           Width of object
;       HEIGHT                          Height of object
;	    ou
;       SIZE                            x y width height  of object
;       VISIBLE                         Object visible or not [0..1]
;       ENABLE                          Object enable (ie valid) or not [0..1]
;       USER_MOVABLE                    User can move object with mouse
;       DRAG_AND_DROP                   NOT USED
;       BORDER_COLOR                    Define a border color
;       BACK_COLOR                      Define a back color
;       TEXTURE                         Texture name to use
;       TEXTURE_MOSAIC                  Texture to mosaic [0*..1]
;       TEXTURE_FRAME                   Frame in texture to use [0*..[
;       TEXT_COLOR                      Define a text color
;       TEXT_HEIGHT                     Height of text to display
;       TEXT_FONT                       Font filename to use
;       TEXT_JUSTIFY                    Combination : LEFT | RIGHT | X | UP | DOWN | Y | CENTER
;       TEXT                            Text to display
;       HINT                            Hint of object
;       USER_ID                         User defined ID
;       ALIGN_LEFT                      Align object on left side when resolution change [0..1]
;       ALIGN_UP                        Align object on up side when resolution change [0..1]
;       ALIGN_RIGHT                     Align object on right side when resolution change [0..1]
;       ALIGN_DOWN                      Align object on down side when resolution change [0..1]
;       ALIGN_CENTER                    Center object on parent [0..1]
;       ALIGN_USER_DEFINED              User defined center [0..1] generate OnGenericMessage ;                                        (E_MO_WIDGET_SUB_MESSAGE_SET_NEW_RESOLUTION, T_MO_WIDGET_RESOLUTION*, -1, -1, -1);
;	SOUND_ON_DOWN 			Used for defined the sound to play on Action down
;	SOUND_ON_UP			Used for defined the sound to play on Action Up
;	SOUND_ON_DOWN_DISABLE		Used for defined the sound to play on Action Down and button is disable
;	SOUND_ON_UP_DISABLE		Used for defined the sound to play on Action Up and Widget is disable
;	SOUND_ON_VISIBLE		Used for defined the sound to play on Visible Action
;	SOUND_ON_HIDE			Used for defined the sound to play on Hide Action
;	SOUND_ON_ENABLE			Used for defined the sound to play on Enable Action
;	SOUND_ON_DISABLE		Used for defined the sound to play on Disable Action
;	SOUND_ON_FOCUS			Used for defined the sound to play on Focus Action
;
;   Parametres (BUTTON)
;       BTN_SUB_TYPE                    NORMAL* | SWITCH | CHECK_BOX
;       BTN_START_STATE                 DOWN | UP*
;
;   Parametres (EDIT)
;       EDIT_MAX_LENGTH                 Maximum length for edit
;       EDIT_TO_UPPER                   Convert to upper
;       EDIT_TO_LOWER                   Convert to lower
;       EDIT_TYPE                       NORMAL* | S32 | U32 | F32| ALPHA | ALPHANUM | FILENAME | IP
;
;   Parametres (GROUP)
;       GB_NO_EMPTY_SELECTION           User cannot unselect all buttons
;
;   Parametres (HSCROLL)
;       HS_POSITION                     Position in scroll bar
;       HS_RANGE                        Max range of scroll bar
;
;   Parametres (VSCROLL)
;       VS_POSITION                     Position in scroll bar
;       VS_RANGE                        Max range of scroll bar
;
;   Parametres (LISTBOX)
;       LB_VSCROLL_WIDTH                Width in pixels of scroll bar
;       LB_FIRST_LINE_SEPARATOR         Draw first line separator
;       LB_LINE_SEPARATOR               Draw all lines separator
;       LB_SELECTED_SEPARATOR_COLOR     Separator color
;       LB_SELECTED_LINE_COLOR          Selected line color
;       LB_HIGHLIGHT_LINE_COLOR         Color for highlight line
;       LB_HIGHLIGHT_CELL_COLOR         Color for highlight cell
;       LB_LINE_HEIGHT                  Height in pixels of each line
;       LB_NB_COLUMNS                   Number of columns
;       LB_COLUMNx_WIDTH                Width of each column (replace 'x' by [0..LB_NB_COLUMNS[
;
;   Parametres (COMBOBOX)
;       CB_REDUCED_HEIGHT               Size of edit text & deploy button when combo is reduced
;       CB_VSCROLL_WIDTH                Width of scroll bar
;       CB_LB_LINE_HEIGHT               Line height in listbox
;
;   Parametres (PROGRESSBAR)
;       PB_CURRENT_PROGRESS             Current progression
;       PB_MIN_PROGRESS                 Min progression ]..[ 0*
;       PB_MAX_PROGRESS                 Max progression
;       PB_VERTICAL                     Vertical draw [0..1]
;       PB_ZERO_CENTER                  Center draw on 0 [0..1]
;       PB_TEXTURE                      Texture name to use during progression
;       PB_TEXTURE_FRAME                Frame in object to use
;
;   Parametres (GRAPHICCURVES)
;       GC_MIN_SCALE                    Minimum scale for all curves
;       GC_MAX_SCALE                    Maximum scale for all curves
;       GC_AUTO_SCALE                   Adjust scale when going out of bounds [0..1]
;       GC_NB_CURVES                    Define number of curves to use
;       GC_SAMPLES_PER_CURVE            Number of sample to have in a curve
;       GC_UPDATE_TIME                  Time before scrolling curve to the left
;       GC_CURVEx_COLOR                 Define curve color
;       GC_CURVEx_VISIBLE               Define if a curve is visible or not
;
;   Parametres (RENDERVIEW)
;       RV_ZMIN                         Min Z value
;       RV_ZMAX                         Max Z value
;
; *******************************************************************************************

; *******************************************************************************************
; hiérarchie des widgets
;
; ROOT                     racine principale telle que définie par OverlayWidget
; |
; +-- MAINFRAME            frame principale regroupant toutes les widgets du jeu
;     |                    elle défini aussi la taille de l'écran pour gérer les changements
;     |                    de résolution dans OverlayWidget
;     |
;     +-- MESSAGEBOX       widget spéciale: peut shunter le fonctionnement du backdrop pour
;     |                    simuler le fonctionnement d'une boite de dialogue modale
;     |
;     +-- WORKSPACE        frame regroupant toutes les widgets propres aux différents modes
;         |                de jeu
;         |
;         +-- BACKDROP     une renderview pour y dessiner la vue 3D; attention! comme elle
;         |                est gérée par OverlayWidget il bien tenir de ses niveaux de
;         |                priorité d'affichage
;         |
;         +-- PANEL_...    tous les paneaux utilisés dans les différents modes de jeu
;         | 
;         +-- PAGE_...     toutes les pages utilisés dans les menus
;
; *******************************************************************************************

;---------------------------------------
[WID_MAINFRAME]
TYPE           = "WIDGET"
PARENT         = "ROOT"
PRIORITY       = 5
ZPRIORITY      = 0.95
SIZE           = 0 0 799 599
ALIGN_UP       = 1
ALIGN_DOWN     = 1
ALIGN_LEFT     = 1
ALIGN_RIGHT    = 1
;BORDER_COLOR   = 0 0 255 255
VISIBLE        = 1
ENABLE         = 1

;---------------------------------------
[WID_WORKSPACE]
TYPE           = "WIDGET"
PARENT         = "WID_MAINFRAME"
PRIORITY       = 10
ZPRIORITY      = 0.90
SIZE           = 0 0 799 599
ALIGN_UP       = 1
ALIGN_DOWN     = 1
ALIGN_LEFT     = 1
ALIGN_RIGHT    = 1
VISIBLE        = 1
ENABLE         = 1

; *******************************************************************************************
[#INCLUDE]
FILE0 = "./Common/Panel_MessageBox.Ini"
FILE1 = "./Game/MainGameinterface.Ini"
FILE2 = "./Menu/MainMenuInterface.Ini"



